services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: roulette-kaki:local
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SERVE_STATIC: "1"
      USE_LOCAL_STUBS: "0"
      # AWS_PROFILE lets the mounted ~/.aws credentials resolve. Change if
      # you use a non-default profile.
      AWS_PROFILE: "hack2026_IsbUsersPS-388562170161"
    volumes:
      # Read-write so botocore can rotate the SSO token cache under
      # ~/.aws/sso/cache/. A read-only mount breaks SSO refresh — the
      # token IS renewed but the write-back fails on tempfile creation.
      - ~/.aws:/root/.aws
